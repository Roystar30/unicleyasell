<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Unicleya</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f8f9fb;
      color: #333;
      text-align: center;
    }
    .error-box {
      max-width: 500px;
      padding: 40px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 4rem;
      margin: 0;
      color: #e63946;
    }
    p {
      margin: 16px 0;
    }
    a.btn {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 8px;
      background: #0077ff;
      color: #fff;
      text-decoration: none;
      transition: background 0.2s;
    }
    a.btn:hover {
      background: #005fcc;
    }
  </style>
</head>
<body>
  <div class="error-box">
    <h1>404</h1>
    <p>Oops! The page you’re looking for doesn’t exist.</p>
    <a href="/index.html" class="btn">🏠 Back to Home</a>
  </div>
</body>
</html>
<!--
  404.html
  A simple custom 404 error page for the Unicleya website.
