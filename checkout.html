<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout — Unicleya</title>
  <link rel="stylesheet" href="stylesheet.css" />
</head>
<body>
  <div class="page-wrapper">
    <div class="progress" id="progress"></div>

    <header>
      <div class="header-content">
        <div class="header-left">
          <button class="hamburger-btn" id="hamburger" aria-label="Open menu">
            <span></span><span></span><span></span>
          </button>
          <div class="logo" id="homeLogo" tabindex="0" role="button" aria-label="Go to home">
            <a href="index.html" class="brand" aria-label="Unicleya home">
              <img src="logo.png" alt="Unicleya logo" class="brand-logo" />
            </a>
            <div>
              <h1>Unicleya</h1>
              <div class="tagline">Second‑hand tech market</div>
            </div>
          </div>
        </div>

        <div class="header-right">
          <button class="pill" id="accountBtn" onclick="window.location.href='account.html'">Account</button>
          <button class="pill primary" id="cartBtn" onclick="window.location.href='cart.html'">Cart <span id="cartCount" class="cart-badge">0</span></button>
          <button class="pill" id="loginBtn">Sign in</button>
        </div>
      </div>
    </header>

    <!-- Side Nav -->
    <aside class="side-nav" id="sideNav" aria-hidden="true">
      <div class="side-nav-header">
        <div class="side-brand">
          <img src="logo.png" alt="Unicleya" />
          <strong>Unicleya</strong>
        </div>
        <button class="pill" id="closeNav">Close</button>
      </div>
      <nav class="side-nav-content">
        <a class="nav-item" href="index.html">🏠 Home</a>
        <a class="nav-item" href="cart.html">🛒 Cart</a>
        <a class="nav-item active" href="checkout.html">💳 Checkout</a>
        <a class="nav-item" href="account.html">👤 Account</a>
      </nav>
      <div class="side-nav-footer">
        <a class="nav-item contact" href="mailto:support@unicleya.com">✉️ Contact us</a>
        <small>© <span id="year"></span> Unicleya</small>
      </div>
    </aside>
    <div class="overlay" id="overlay"></div>

    <div class="loader-spot" id="loader" aria-hidden="true">
      <div class="spinner"></div>
      <div class="loader-text">Working...</div>
    </div>

    <main class="main-content">
      <div class="container">
        <section id="page-checkout" class="page show">
          <h2 class="section-title">Checkout</h2>
          <div class="section-subtitle">Enter your details and confirm your order.</div>
          <div class="form-grid">
            <div>
              <label>Full Name</label>
              <input id="coName" placeholder="Your name" required>
            </div>
            <div>
              <label>Mobile</label>
              <input id="coPhone" placeholder="e.g. 7057257971" required>
            </div>
            <div>
              <label>Email</label>
              <input id="coEmail" type="email" placeholder="you@example.com" required>
            </div>
            <div class="full">
              <label>Address</label>
              <textarea id="coAddress" rows="3" placeholder="Flat, Street, City, PIN" required></textarea>
            </div>
            <div>
              <label>Payment</label>
              <select id="coPayment">
                <option value="cod">Cash on Delivery</option>
                <option value="upi">UPI</option>
                <option value="card">Card</option>
              </select>
            </div>
          </div>
          <div class="summary-card">
            <div class="summary-head">
              <strong>Order Summary</strong>
              <strong id="coTotal">₹0</strong>
            </div>
            <div id="coItems" class="summary-items"></div>
            <div class="summary-actions">
              <button class="btn ghost" id="backToCart" onclick="window.location.href='cart.html'">Back to Cart</button>
              <button class="btn primary" id="placeOrderBtn">Place Order</button>
            </div>
            <div id="checkoutMsg" class="success-msg" style="display:none"></div>
          </div>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <div class="footer-left">
          <img src="logo.png" alt="" class="footer-logo" />
          <div>
            <strong>Unicleya</strong><br/>
            <span class="muted">Refurbished tech marketplace</span>
          </div>
        </div>
        <div class="footer-right">
          <a href="#" aria-label="Twitter" class="soc">X</a>
          <a href="#" aria-label="Instagram" class="soc">IG</a>
          <a href="#" aria-label="Facebook" class="soc">Fb</a>
          <a href="#" aria-label="LinkedIn" class="soc">In</a>
        </div>
      </div>
      <div class="footer-bottom">© <span id="year2"></span> Unicleya. All rights reserved.</div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
