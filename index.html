<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Unicleya — Buy & Sell Refurbished Tech</title>
  <meta name="description" content="Unicleya — buy & sell refurbished mobiles & computers." />
  <link rel="stylesheet" href="stylesheet.css" />
</head>
<body>
  <div class="page-wrapper">
    <!-- Header -->
    <header>
      <div class="header-content">
        <div class="header-left">
          <a href="index.html" class="logo" aria-label="Unicleya Home">
            <img src="logo.png" alt="Unicleya logo" class="brand-logo" width="200" />
            <div>
              <h1>Unicleya</h1>
              <div class="tagline">Second-hand tech market</div>
            </div>
          </a>
        </div>

        <div class="search-container">
          <form id="searchForm" class="search-bar" role="search">
            <input id="searchInput" placeholder="Search devices..." aria-label="Search products" autocomplete="off" />
            <button id="doSearch" class="search-btn" type="submit" aria-label="Search">Search</button>
          </form>
        </div>

        <div class="header-right">
          <a class="pill" href="account.html">Account</a>
          <a class="pill primary" href="cart.html">Cart <span id="cartCount">0</span></a>
          <a class="pill" href="login.html">Sign in</a>
        </div>
      </div>
    </header>

    <!-- HOME CONTENT -->
    <main class="main-content">
      <div class="container">
        <section>
          <h2 class="section-title">Shop Refurbished Tech</h2>
          <div class="section-subtitle">Quality checked mobiles, computers, and accessories — priced right.</div>

          <div class="filters">
            <div class="chips" id="categoryChips">
              <div class="chip selected" data-cat="all">🌐 All</div>
              <div class="chip" data-cat="mobiles">📱 Mobiles</div>
              <div class="chip" data-cat="computers">💻 Computers</div>
              <div class="chip" data-cat="accessories">🎧 Accessories</div>
            </div>
          </div>

          <div id="resultMeta" class="result-meta"></div>
          <div class="grid" id="listings"></div>
        </section>
      </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
      <div class="footer-inner">
        <div class="footer-left">
          <img src="logo.png" alt="" class="footer-logo" />
          <div>
            <strong>Unicleya</strong><br/>
            <span class="muted">Refurbished tech marketplace</span>
          </div>
        </div>
        <div class="footer-right">
          <a href="#">X</a>
          <a href="#">IG</a>
          <a href="#">Fb</a>
          <a href="#">In</a>
        </div>
      </div>
      <div class="footer-bottom">© <span id="year"></span> Unicleya. All rights reserved.</div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
