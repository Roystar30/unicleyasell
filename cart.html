<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart — Unicleya</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">

  <!-- Header -->
  <header class="bg-white shadow p-4 flex justify-between items-center">
    <h1 class="text-2xl font-bold text-indigo-600 cursor-pointer" onclick="window.location.href='index.html'">Unicleya</h1>
    <div class="flex gap-3">
      <button onclick="window.location.href='index.html'" class="px-4 py-2 rounded-full bg-gray-200 hover:bg-gray-300">Home</button>
      <button onclick="window.location.href='cart.html'" class="px-4 py-2 rounded-full bg-indigo-600 text-white hover:bg-indigo-700">Cart</button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto mt-8 p-4">
    <h2 class="text-3xl font-semibold mb-6">Shopping Cart</h2>

    <!-- Cart Items -->
    <div id="cartItems" class="grid md:grid-cols-2 gap-6">
      <!-- Items will be injected by JS -->
    </div>

    <!-- Cart Summary -->
    <div class="mt-10 bg-white shadow rounded-2xl p-6 max-w-md ml-auto">
      <h3 class="text-xl font-semibold mb-4">Order Summary</h3>
      <div class="flex justify-between mb-2">
        <span>Subtotal</span>
        <span id="subtotal" class="font-medium">₹0</span>
      </div>
      <div class="flex justify-between mb-2">
        <span>Shipping</span>
        <span class="font-medium">₹199</span>
      </div>
      <hr class="my-3">
      <div class="flex justify-between text-lg font-bold">
        <span>Total</span>
        <span id="total">₹199</span>
      </div>
      <button class="w-full mt-6 bg-indigo-600 text-white py-3 rounded-2xl hover:bg-indigo-700 transition" onclick="checkout()">
        Proceed to Checkout
      </button>
    </div>
  </main>

  <!-- Footer -->
  <footer class="mt-12 py-6 text-center text-gray-500">
    © 2025 Unicleya — Refurbished Tech Marketplace
  </footer>

  
</body>
</html>
