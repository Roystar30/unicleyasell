<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Cart - Unicleya</title>
  <link rel="stylesheet" href="stylesheet.css" />
  </head>
  <body>
  <div class="page-wrapper">
    <div class="progress" id="progress"></div>

   <header>
      <div class="header-content">
        <div class="header-left">
          <button class="hamburger-btn" id="hamburger" aria-label="Open menu">
            <span></span><span></span><span></span>
          </button>
          <div class="logo" id="homeLogo" tabindex="0" role="button" aria-label="Go to home">
            <a href="index.html" class="brand" aria-label="Unicleya home">
              <img src="logo.png" alt="Unicleya logo" class="brand-logo" width="512" height="160" decoding="async" fetchpriority="high" loading="eager" />
            </a>
            <div>
              <h1>Unicleya</h1>
              <div class="tagline">Second‑hand tech market</div>
            </div>
          </div>
        </div>

        <div class="header-right">
          <button class="pill" id="accountBtn">Account</button>
          <button class="pill" id="loginBtn">Sign in</button>
        </div>
      </div>
    </header>
    <!-- Account Popup -->
    <div id="accountPopup" class="popup-overlay">
      <div class="popup-box">
        <button class="close-btn" onclick="toggleAccountPopup(false)">×</button>
        <h2>My Account</h2>
        <div id="accountArea"></div>
      </div>
    </div>
    <!-- Side Nav -->
    <aside class="side-nav" id="sideNav" aria-hidden="true">
      <div class="side-nav-header">
        <div class="side-brand">
          <img src="logo.png" alt="Unicleya" />
          <strong>Unicleya</strong>
        </div>
        <button class="pill" id="closeNav">Close</button>
      </div>
      <nav class="side-nav-content">
        <a class="nav-item active" href="index.html">🏠 Home</a>
        <a class="nav-item" href="cart.html">🛒 Cart</a>
        <a class="nav-item" href="checkout.html">💳 Checkout</a>
        <a class="nav-item" href="account.html">👤 Account</a>
      </nav>
      <div class="side-nav-footer">
        <a class="nav-item contact" href="mailto:support@unicleya.com">✉️ Contact us</a>
        <small>© <span id="year"></span> Unicleya</small>
      </div>
    </aside>
  <!-- ===== HEADER (reuse from index.html) ===== -->
  <!-- 🔽 Paste your full header code from index.html -->
 
  <!-- ===== MAIN CART CONTENT ===== -->
  <main class="cart-page">
    <h2>Your Shopping Cart</h2>
    
    <!-- Cart items injected dynamically -->
    <div id="cartItems" class="cart-items"></div>

    <!-- Cart summary -->
    <div class="cart-summary">
      <h3>Total: ₹<span id="cartTotal">0</span></h3>
      <div class="cart-actions">
        <button class="pill" onclick="window.location.href='index.html'">← Back to Home</button>
        <button class="pill primary" id="checkoutBtn">Proceed to Checkout</button>
      </div>
    </div>
  </main>

  <!-- ===== FOOTER (reuse from index.html) ===== -->
  <!-- 🔽 Paste your full footer code from index.html -->
 <footer class="site-footer">
      <div class="footer-inner">
        <div class="footer-left">
          <img src="logo.png" alt="" class="footer-logo" />
          <div>
            <strong>Unicleya</strong><br/>
            <span class="muted">Refurbished tech marketplace</span>
          </div>
        </div>
        <div class="footer-right">
          <a href="#" aria-label="Twitter" class="soc">X</a>
          <a href="#" aria-label="Instagram" class="soc">IG</a>
          <a href="#" aria-label="Facebook" class="soc">Fb</a>
          <a href="#" aria-label="LinkedIn" class="soc">In</a>
        </div>
      </div>
      <div class="footer-bottom">© <span id="year2"></span> Unicleya. All rights reserved.</div>
    </footer>
  <script src="script.js"></script>
</body>
</html>
