<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Your Cart - Unicleya</title>
  <link rel="stylesheet" href="stylesheet.css"/>
</head>
<body>
  <div class="page-wrapper">
    <div class="progress" id="progress"></div>
    <header>
      <div class="header-content">
          <h2>Your Cart</h2>
        </div>
        <div class="header-right">
          <button class="pill" id="accountBtn">Account</button>
          <button class="pill primary" id="cartBtn">Cart <span id="cartCount" class="cart-badge">0</span></button>
        </div>
      </div>
    </header>

    <main>
      <h2>Shopping Cart</h2>
      <div id="cartEmpty" style="display:none">Your cart is empty.</div>
      <div id="cartList" class="cart-list"></div>
      <div id="cartFooter" class="cart-footer" style="display:none">
        <div>Total: <span id="cartTotal">₹0</span></div>
        <div class="actions">
          <button id="clearCartBtn" class="btn ghost">Clear Cart</button>
          <button id="toCheckoutBtn" class="btn primary">Proceed to Checkout</button>
        </div>
      </div>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
