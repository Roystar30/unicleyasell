<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Cart - Unicleya</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
</head>
<body>
  <!-- ===== HEADER (same as index.html) ===== -->
  <header class="header">
    <div class="header-left">
      <!-- 🔽 Replace with your actual logo markup from index.html -->
      <a href="index.html">
        <img src="logo.png" alt="Unicleya Logo" class="logo">
      </a>
    </div>
    <div class="header-right">
      <button class="pill" id="accountBtn">Account</button>
      <button class="pill primary" id="cartBtn" onclick="window.location.href='cart.html'">
        Cart <span id="cartCount">(0)</span>
      </button>
    </div>
  </header>

  <!-- ===== ACCOUNT POPUP (required for accountBtn to work) ===== -->
  <div id="accountPopup" class="popup hidden">
    <div class="popup-content">
      <button class="close" onclick="toggleAccountPopup(false)">×</button>
      <h3>Your Account</h3>
      <p>Manage your profile, orders, and settings here.</p>
      <button id="loginBtn" class="pill primary">Login</button>
    </div>
  </div>

  <!-- ===== MAIN CART CONTENT ===== -->
  <main class="cart-page">
    <h2>Your Shopping Cart</h2>
    
    <!-- Cart items injected by script.js -->
    <div id="cartItems" class="cart-items"></div>

    <!-- Cart summary -->
    <div class="cart-summary">
      <h3>Total: ₹<span id="cartTotal">0</span></h3>
      <div class="cart-actions">
        <button class="pill" onclick="window.location.href='index.html'">← Back to Home</button>
        <button class="pill primary" id="checkoutBtn">Proceed to Checkout</button>
      </div>
    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <p>© 2025 Unicleya • Refurbished Tech Marketplace</p>
  </footer>

</body>
</html>
