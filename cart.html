<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Cart - Unicleya</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
  <style>
    /* --- Cart Page Styles --- */
    .cart-page { max-width: 1000px; margin: 2rem auto; padding: 1rem; }
    .cart-items { display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem; }
    .cart-item {
      display: grid;
      grid-template-columns: 80px 1fr auto auto;
      gap: 1rem;
      align-items: center;
      background: #fff;
      padding: 1rem;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .cart-item img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; }
    .cart-item .info h4 { margin: 0; font-size: 1rem; }
    .cart-item .info p { margin: 0.25rem 0 0; font-size: 0.9rem; color: #555; }
    .cart-item .price { font-weight: bold; }
    .cart-item button { background: #ff5252; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    .cart-summary {
      margin-top: 2rem;
      padding: 1.5rem;
      border-radius: 12px;
      background: #fafafa;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .cart-summary h3 { margin-bottom: 1rem; }
    .cart-actions { display: flex; justify-content: space-between; gap: 1rem; }
  </style>
</head>
<body>
  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="header-left">
      <!-- 🔽 Replace this with your actual logo markup from index.html -->
      <!-- Example: -->
      <a href="index.html">
        <img src="assets/logo.png" alt="Unicleya Logo" class="logo">
      </a>
    </div>
    <div class="header-right">
      <button class="pill" id="accountBtn">Account</button>
      <button class="pill primary" id="cartBtn" onclick="window.location.href='cart.html'">
        Cart <span id="cartCount">(0)</span>
      </button>
    </div>
  </header>

  <!-- ===== MAIN CART CONTENT ===== -->
  <main class="cart-page">
    <h2>Your Shopping Cart</h2>
    
    <!-- Items injected by script.js -->
    <div id="cartItems" class="cart-items"></div>

    <!-- Cart summary -->
    <div class="cart-summary">
      <h3>Total: ₹<span id="cartTotal">0</span></h3>
      <div class="cart-actions">
        <button class="pill" onclick="window.location.href='index.html'">← Back to Home</button>
        <button class="pill primary" id="checkoutBtn">Proceed to Checkout</button>
      </div>
    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <p>© 2025 Unicleya • Refurbished Tech Marketplace</p>
  </footer>

  <script>
    // ✅ Inject cart items using your existing localStorage data
    function renderCartPage() {
      const cart = JSON.parse(localStorage.getItem('cart') || '[]');
      const container = document.getElementById('cartItems');
      const totalEl = document.getElementById('cartTotal');
      let total = 0;

      container.innerHTML = '';

      if (cart.length === 0) {
        container.innerHTML = '<p>Your cart is empty.</p>';
        totalEl.textContent = '0';
        return;
      }

      cart.forEach((item, idx) => {
        total += item.price * item.qty;
        const div = document.createElement('div');
        div.className = 'cart-item';
        div.innerHTML = `
          <img src="${item.image || 'placeholder.png'}" alt="${item.name}">
          <div class="info">
            <h4>${item.name}</h4>
            <p>Qty: ${item.qty}</p>
          </div>
          <div class="price">₹${item.price * item.qty}</div>
          <button onclick="removeFromCart(${idx})">Remove</button>
        `;
        container.appendChild(div);
      });

      totalEl.textContent = total;
    }

    // ✅ Remove item and re-render
    function removeFromCart(idx) {
      let cart = JSON.parse(localStorage.getItem('cart') || '[]');
      cart.splice(idx, 1);
      localStorage.setItem('cart', JSON.stringify(cart));
      renderCartPage();
      updateCartCount(); // already in your script.js
    }

    // ✅ Checkout button (you already handle checkout in script.js)
    document.getElementById('checkoutBtn').addEventListener('click', () => {
      window.location.href = 'checkout.html';
    });

    // Render on load
    renderCartPage();
  </script>
</body>
</html>
