<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your Cart — Unicleya</title>
  <link rel="stylesheet" href="stylesheet.css" />
</head>
<body>
  <div class="page-wrapper">
    <div class="progress" id="progress"></div>

    <header>
      <div class="header-content">
        <div class="header-left">
          <button class="hamburger-btn" id="hamburger" aria-label="Open menu">
            <span></span><span></span><span></span>
          </button>
          <div class="logo" id="homeLogo" tabindex="0" role="button" aria-label="Go to home">
            <a href="index.html" class="brand" aria-label="Unicleya home">
              <img src="logo.png" alt="Unicleya logo" class="brand-logo" />
            </a>
            <div>
              <h1>Unicleya</h1>
              <div class="tagline">Second‑hand tech market</div>
            </div>
          </div>
        </div>

        <div class="header-right">
          <button class="pill" id="accountBtn" onclick="window.location.href='account.html'">Account</button>
          <button class="pill primary" id="cartBtn">Cart <span id="cartCount" class="cart-badge">0</span></button>
          <button class="pill" id="loginBtn">Sign in</button>
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="container">
        <section id="page-cart" class="page show">
          <h2 class="section-title">Your Cart</h2>
          <div class="section-subtitle">Review items and adjust quantities.</div>
          <div id="cartEmpty" class="empty">Your cart is empty.</div>
          <div class="cart-list" id="cartList"></div>
          <div class="cart-footer" id="cartFooter">
            <div><strong>Total:</strong> <span id="cartTotal">₹0</span></div>
            <div class="row-actions">
              <button class="btn ghost" id="clearCartBtn">Clear</button>
              <button class="btn primary" id="toCheckoutBtn" onclick="window.location.href='checkout.html'">Proceed to Checkout</button>
            </div>
          </div>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <div class="footer-left">
          <img src="logo.png" alt="" class="footer-logo" />
          <div>
            <strong>Unicleya</strong><br/>
            <span class="muted">Refurbished tech marketplace</span>
          </div>
        </div>
        <div class="footer-right">
          <a href="#" aria-label="Twitter" class="soc">X</a>
          <a href="#" aria-label="Instagram" class="soc">IG</a>
          <a href="#" aria-label="Facebook" class="soc">Fb</a>
          <a href="#" aria-label="LinkedIn" class="soc">In</a>
        </div>
      </div>
      <div class="footer-bottom">© <span id="year2"></span> Unicleya. All rights reserved.</div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
